<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="date">
        <p class="date__greeting">Добрый 
            <span id="greeting"></span>
        </p>
        <p class="date__day">Сегодня: 
            <span id="day"></span>
        </p>
        <p class="date__time">Текущее время: 
            <span id="time"></span>
        </p>
        <p class="date__new-year">До нового года осталось <span id="newYearCount"></span> дней</p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
